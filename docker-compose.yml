services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      - db
      - redis
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_only_change_me
      POSTGRES_DB: hamdan_sports_complex_unified_arena_academy_plat
    ports:
      - "5432:5432"
    volumes:
      - ./db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
