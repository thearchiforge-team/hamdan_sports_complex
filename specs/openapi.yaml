openapi: 3.1.0
info:
  title: Hamdan Sports Complex Unified Arena & Academy Platform API
  version: 1.0.0
  description: Unified Microsoft Azure (UAE North) digital venue, ticketing, member access, and sports academy lane/court booking platform for Hamdan Sports Complex (15,000-seat multi-purpose Olympic arena & aquatics center in Dubai)
servers:
  - url: https://api.hamdansportscomplex.ae
    description: Azure Front Door Premium + API Management Production Gateway (UAE North)
  - url: http://localhost:8000
    description: Local Development & Contract Testing
paths:
