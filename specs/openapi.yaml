openapi: 3.1.0
info:
  title: Shared Team Blueprints API
  version: 1.0.0
  description: ArchiForge governed OpenAPI 3.1 contract for Shared Team Blueprints
servers:
  - url: https://api.enterprise.internal
    description: Production Gateway
  - url: http://localhost:8000
    description: Local Development
paths:
  /health:
    get:
      summary: Liveness & Readiness Probe
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: Service healthy
  /v1/venues-and-zones:
    get:
      summary: List VenuesAndZones records
      operationId: listVenuesAndZoness
      tags: [VenuesAndZones]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paginated list of VenuesAndZones items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenuesAndZones'
    post:
      summary: Create a new VenuesAndZones
      operationId: createVenuesAndZones
      tags: [VenuesAndZones]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenuesAndZonesCreate'
      responses:
        '201':
          description: Created VenuesAndZones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenuesAndZones'
  /v1/arena-events:
    get:
      summary: List ArenaEvents records
      operationId: listArenaEventss
