components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Microsoft Entra External ID / B2B OAuth 2.0 JWT Bearer Token
    UaePassOIDC:
      type: openIdConnect
      openIdConnectUrl: https://stg-id.uaepass.ae/idshub/.well-known/openid-configuration
      description: UAE PASS National Digital Identity OIDC Federation
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: UUIDv4 key enforcing idempotent mutation retries across seat locks, payments, and bookings
      schema:
        type: string
        format: uuid
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: Distributed W3C trace correlation identifier propagated to structured JSON logs
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    StatusFilterParam:
      name: status
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequestError:
      description: Validation failure or malformed payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnauthorizedError:
      description: Missing or invalid JWT Bearer / UAE PASS OIDC token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: Insufficient RBAC role or anti-passback/zone access denial
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConflictError:
      description: Resource state conflict (e.g., seat already locked/booked or pool bulkhead schedule overlap)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimitExceededError:
      description: API Management rate limit or Championship Waiting Room throttle exceeded (429 Too Many Requests)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailableError:
      description: Upstream dependency or circuit breaker open (503 Service Unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [code, message, trace_id]
      properties:
        code:
          type: string
        message:
          type: string
        detail:
          type: string
        trace_id:
          type: string
    SeatLockRequest:
      type: object
      required: [event_id, customer_email, seat_section, seat_row, seat_number, price_aed]
      properties:
        event_id:
          type: string
          format: uuid
        customer_email:
          type: string
          format: email
        seat_section:
          type: string
        seat_row:
          type: string
        seat_number:
          type: string
        price_aed:
          type: number
          minimum: 0
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 900
          default: 480
    SeatLockResponse:
      type: object
      required: [booking_id, lock_token, event_id, seat_key, ttl_seconds, lock_expires_at, booking_status]
      properties:
        booking_id:
          type: string
          format: uuid
        lock_token:
          type: string
        event_id:
          type: string
