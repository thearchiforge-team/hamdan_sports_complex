      responses:
        '201':
          description: Created ArenaEvents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaEvents'
  /v1/ticket-bookings:
    get:
      summary: List TicketBookings records
      operationId: listTicketBookingss
      tags: [TicketBookings]
      security:
        - BearerAuth: []
      responses:
