components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    VenuesAndZones:
      type: object
      properties:
        zone_id:
          type: string
        zone_name:
          type: string
        facility_type:
          type: string
        max_capacity:
          type: string
        pool_bulkhead_mode:
          type: string
        depth_meters:
          type: string
        is_active:
          type: string
    VenuesAndZonesCreate:
      type: object
      properties:
        zone_id:
          type: string
        zone_name:
          type: string
        facility_type:
          type: string
        max_capacity:
          type: string
        pool_bulkhead_mode:
          type: string
        depth_meters:
          type: string
        is_active:
          type: string
    ArenaEvents:
      type: object
      properties:
        event_id:
          type: string
        zone_id:
          type: string
        title:
          type: string
        event_category:
          type: string
        start_time:
          type: string
        end_time:
          type: string
        total_seats:
          type: string
        status:
          type: string
    ArenaEventsCreate:
      type: object
      properties:
        event_id:
          type: string
        zone_id:
          type: string
        title:
          type: string
        event_category:
