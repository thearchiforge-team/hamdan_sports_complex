          type: string
        event_id:
          type: string
        customer_email:
          type: string
        seat_section:
          type: string
        seat_row:
          type: string
        seat_number:
          type: string
        price_aed:
          type: string
        lock_expires_at:
          type: string
        payment_ref:
          type: string
        qr_pass_hash:
          type: string
        booking_status:
          type: string
    TicketBookingsCreate:
      type: object
      properties:
        booking_id:
          type: string
        event_id:
          type: string
        customer_email:
          type: string
        seat_section:
          type: string
        seat_row:
