    Memberships:
      type: object
      properties:
        member_id:
          type: string
        full_name:
          type: string
        emirates_id_hash:
          type: string
        tier:
          type: string
        nfc_wristband_uid:
          type: string
        valid_from:
          type: string
        valid_until:
          type: string
        auto_renew:
          type: string
        status:
          type: string
    MembershipsCreate:
      type: object
      properties:
        member_id:
          type: string
        full_name:
          type: string
        emirates_id_hash:
          type: string
        tier:
          type: string
        nfc_wristband_uid:
